name: CI

on:
  pull_request:
    branches: [main, master]
    types: [opened, synchronize, reopened]
  push:
    branches: [main, master]

jobs:
  # ============================================================
  # Build e testes
  # ============================================================
  build-and-test:
    name: Build e Testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Build (tsc + vite)
        run: npm run build

      - name: Rodar testes (se existir script "test")
        run: npm test

      - name: Upload resultados de teste
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-results
          path: dist/

  # ============================================================
  # Estilo de código (indentação + ESLint)
  # ============================================================
  code-style:
    name: Estilo de Código
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Verificar indentação TS/TSX/CSS/JSON
        run: |
          set -e
          echo "Verificando indentação em arquivos TypeScript..."
          
          # Não deve haver tabs em arquivos de código
          if grep -rP "\t" --include="*.ts" --include="*.tsx" --include="*.css" --include="*.json" src/; then
            echo "ERRO: Encontrado tab em arquivo de código"
            echo "Use espaços em vez de tabs"
            exit 1
          fi
          
          echo "Indentação com espaços OK"

      - name: ESLint
        run: npm run lint

  # ============================================================
  # Convenção de commits
  # ============================================================
  commit-convention:
    name: Convenção de Commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verificar padrão de commits
        run: |
          set -e
          echo "Verificando convenção de commits..."
          
          # Padrão de commits aceitos
          PATTERN="^(feat|fix|docs|style|refactor|test|chore|ci|perf|build|revert):"
          
          # Obter commits do PR
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            COMMITS=$(git log --oneline ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }})
          else
            COMMITS=$(git log --oneline -10)
          fi
          
          echo "Commits encontrados:"
          echo "$COMMITS"
          
          # Verificar cada commit
          echo "$COMMITS" | while read -r line; do
            COMMIT_MSG=$(echo "$line" | cut -d' ' -f2-)
            if ! echo "$COMMIT_MSG" | grep -qE "$PATTERN"; then
              echo "ERRO: Commit não segue o padrão: $COMMIT_MSG"
              echo "Padrão esperado: feat|fix|docs|style|refactor|test|chore: mensagem"
              exit 1
            fi
          done
          
          echo "Convenção de commits OK"
