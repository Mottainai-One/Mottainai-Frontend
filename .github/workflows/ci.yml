name: CI

on:
  pull_request:
    branches: [main, master]
    types: [opened, synchronize, reopened]
  push:
    branches: [main, master]

jobs:
  # ============================================================
  # JOB 1: Build e Testes
  # ============================================================
  build-and-test:
    name: 1. Build e Testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Build (tsc + vite)
        run: npm run build

      - name: Rodar testes (se existir script "test")
        run: npm test --if-present

      - name: Upload resultados de teste
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-results
          path: dist/

  # ============================================================
  # JOB 2: Estilo de Código (indentação + ESLint)
  # ============================================================
  code-style:
    name: 2. Estilo de Código
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Verificar indentação TS/TSX/CSS/JSON
        run: |
          set -e
          echo "Verificando indentação em arquivos TypeScript..."
          
          # Não deve haver tabs em arquivos de código
          if grep -rP "\t" --include="*.ts" --include="*.tsx" --include="*.css" --include="*.json" src/; then
            echo "ERRO: Encontrado tab em arquivo de código"
            echo "Use espaços em vez de tabs"
            exit 1
          fi
          
          echo "Indentação com espaços OK"

      - name: ESLint
        run: npm run lint

  # ============================================================
  # JOB 3: Convenção de Commits
  # ============================================================
  commit-convention:
    name: 3. Convenção de Commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verificar padrão de commits
        run: |
          set -e
          echo "Verificando convenção de commits..."
          
          # Padrão de commits aceitos
          PATTERN="^(feat|fix|docs|style|refactor|test|chore|ci|perf|build|revert):"
          
          # Obter commits do PR
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            COMMITS=$(git log --oneline ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }})
          else
            COMMITS=$(git log --oneline -10)
          fi
          
          echo "Commits encontrados:"
          echo "$COMMITS"
          
          # Verificar cada commit
          echo "$COMMITS" | while read -r line; do
            COMMIT_MSG=$(echo "$line" | cut -d' ' -f2-)
            if ! echo "$COMMIT_MSG" | grep -qE "$PATTERN"; then
              echo "ERRO: Commit não segue o padrão: $COMMIT_MSG"
              echo "Padrão esperado: feat|fix|docs|style|refactor|test|chore: mensagem"
              exit 1
            fi
          done
          
          echo "Convenção de commits OK"

  # ============================================================
  # JOB 5: Idioma dos Comentários
  # ============================================================
  comment-language:
    name: 5. Idioma dos Comentários
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Verificar comentários
        run: |
          echo "Verificando comentários em arquivos TypeScript..."
          
          # Extrair comentários de arquivos .ts/.tsx
          find src/ \( -name "*.ts" -o -name "*.tsx" \) -exec grep -Hn "//\|/\*\|\*" {} \; > /tmp/comments.txt || true
          
          if [ ! -s /tmp/comments.txt ]; then
            echo "Nenhum comentário encontrado"
            exit 0
          fi
          
          echo "Comentários encontrados:"
          cat /tmp/comments.txt
          
          # Verificar se comentários fazem sentido (básico)
          # Procurar por comentários muito curtos ou sem sentido
          while IFS= read -r line; do
            FILE=$(echo "$line" | cut -d: -f1)
            LINE=$(echo "$line" | cut -d: -f2)
            COMMENT=$(echo "$line" | cut -d: -f3-)
            
            # Verificar se comentário tem pelo menos 3 caracteres após //
            CLEAN=$(echo "$COMMENT" | sed -e 's|//||g; s|/\*||g; s|\*/||g' -e 's/^[[:space:]]*//; s/[[:space:]]*$//')
            if [ ${#CLEAN} -lt 3 ]; then
              echo "AVISO: Comentário muito curto em $FILE:$LINE"
            fi
          done < /tmp/comments.txt
          
          echo "Verificação de comentários concluída"

  # ============================================================
  # JOB 6: Idioma do Código
  # ============================================================
  code-language:
    name: 6. Idioma do Código
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Verificar código em inglês
        run: |
          echo "Verificando se código está em inglês..."
          
          # Verificar nomes de componentes, variáveis e funções
          # Procurar por possíveis palavras em português
          PATTERNS="buscar|salvar|atualizar|remover|listar|criar|usuario|senha|produto|loja|venda|estoque|relatorio|dashboard"
          
          if grep -rE "$PATTERNS" --include="*.ts" --include="*.tsx" src/; then
            echo "AVISO: Encontrados possíveis nomes em português"
            echo "Considere usar nomes em inglês: fetch, save, update, delete, list, create"
          fi
          
          echo "Verificação de idioma concluída"